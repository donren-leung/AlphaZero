[project]
name = "alphazero"
version = "0.1.0"
description = ""
authors = [
    {name = "Donren Leung",email = "donren.leung@gmail.com"}
]
license = {text = "GNU GPLv3"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy (>=2.2.3,<3.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "tqdm (>=4.70.1,<5.0.0)"
]

[tool.poetry.dependencies]
torch = { source = "pytorch-cu126" }

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.mypy]
plugins = 'numpy.typing.mypy_plugin'

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
ipykernel = "^7.4.0"
matplotlib = "^3.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
